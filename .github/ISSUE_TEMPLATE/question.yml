name: Question
description: Ask how to set up or use revaiw
title: "[Question]: "
labels: [question]
body:
  - type: markdown
    attributes:
      value: Check the README first (Install, Prerequisites, Config, On a PR). If it's unclear, that's worth a Documentation issue too.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What you've tried, your `.review/config.toml`, relevant `daemon.log` lines (remove anything private).
  - type: input
    id: setup
    attributes:
      label: Setup
      description: "OS, `claude --version`, `gh --version`."
