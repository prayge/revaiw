name: Documentation
description: Something in the README, CONTRIBUTING, SECURITY or templates is wrong, missing or unclear
title: "[Docs]: "
labels: [documentation]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: File and section, or a link.
      placeholder: "README.md → Install"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong or missing
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording
      description: Optional.
