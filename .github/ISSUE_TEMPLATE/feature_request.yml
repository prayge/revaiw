name: Feature request
description: Suggest an improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before you file
      options:
        - label: I searched the existing issues and this isn't a duplicate.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Daemon (reviews, queue, routing, config)
        - Fixes (@review fix, 👍, push)
        - GitHub (mentions, comments, reactions, CI)
        - Claude Code plugin (hooks, commands, statusline)
        - Install / setup
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposal
      description: How you'd like it to work. Note anything that touches the security model (README → Security model).
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd be willing to open a PR for this (see CONTRIBUTING.md).
